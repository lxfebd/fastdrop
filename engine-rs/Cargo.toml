[package]
name = "fastdrop-engine"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "fastdrop-engine"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "http2", "stream", "rustls-tls-native-roots",
] }
tokio = { version = "1", features = [
    "rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "io-std",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
percent-encoding = "2"
