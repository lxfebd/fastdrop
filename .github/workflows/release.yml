name: Release

# 打 v* tag 时发布：在 Windows runner 上构建 Rust 引擎 + 打包 nsis 安装包，
# 连同引擎二进制一起上传到 GitHub Release。本地验证过的产物路径是
# app/release/ 下的 .exe（electron-builder 的 win:nsis 目标）。

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 不缓存 node_modules：electron 的二进制下载（postinstall）在 CI 上
          # 经常被跳过或下载失败，缓存会把「没有 dist/electron.exe」的坏状态
          # 一起缓存进去。让每次 run 重新 npm ci 并下载 electron 最稳。
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-release-${{ runner.os }}-${{ hashFiles('engine-rs/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: engine-rs/target
          key: cargo-build-release-${{ runner.os }}-${{ hashFiles('engine-rs/Cargo.lock') }}

      - name: Build engine (release)
        working-directory: engine-rs
        run: cargo build --release

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      # 显式下载 electron 二进制：npm ci 的 postinstall 在 CI 上偶尔被跳过，
      # 没有 dist/electron.exe，electron-builder 打包时会报
      # ENOENT rename electron.exe -> fastdrop.exe。install.js 幂等，重复跑无害。
      - name: Ensure electron binary
        working-directory: app
        run: node node_modules/electron/install.js

      # 打包前先跑两个离线回归门（都只连本机、不访问任何真实站点）：
      # - 引擎 12+ 用例的 md5/分段/续传回归；
      # - 代理链路端到端（含「改完代理点继续下载必须真的换出口」这条自救路径）。
      # 放在打包之前：装安装包打出来才发现引擎或代理链路是坏的，等于白发布一次。
      # 这里能跑 Electron 是因为 windows-latest 自带桌面会话，且上一步已经确认
      # dist/electron.exe 存在。
      - name: Offline regression gates
        run: |
          python tests/test_engine_rs.py
          python tests/test_proxy_e2e.py

      # electron-builder.yml 的 extraResources 会把引擎打成普通文件放进
      # resources/（asar 里 spawn 不了子进程，必须落盘），这一步就是产出
      # 官方 Windows 安装包的唯一入口。
      - name: Build + package installer
        working-directory: app
        run: npm run dist

      - name: Upload Release assets
        uses: softprops/action-gh-release@v2
        with:
          # app/release/* 包含 nsis 安装包 + latest.yml（electron-updater 的
          # 更新元数据，没有它应用内自动更新就找不到新版本）。
          files: |
            app/release/*.exe
            app/release/latest.yml
            engine-rs/target/release/fastdrop-engine.exe
          generate_release_notes: true