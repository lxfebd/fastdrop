<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; width: 300px; padding: 14px; background: #17181c; color: #e8e8e8; }
  h1 { font-size: 14px; margin: 0 0 10px; color: #fff; font-weight: 600; }
  p { font-size: 12px; line-height: 1.6; margin: 6px 0; color: #b8bcc4; }
  button { width: 100%; margin-top: 10px; padding: 8px 0; border: 0; border-radius: 6px; background: #4f7cff; color: #fff; font-size: 13px; cursor: pointer; }
  button:hover { background: #3f6cef; }
  .status { margin-top: 10px; font-size: 12px; color: #9aa0ab; min-height: 16px; }
  .ok { color: #5fd97a; }
  .bad { color: #ff7a7a; }
</style>
</head>
<body>
  <h1>FastDrop 下载助手</h1>
  <p>在网页的下载链接上点右键 →「用 FastDrop 下载」，链接会直接进入 FastDrop 下载列表，不用复制粘贴。</p>
  <button id="sendCurrent">把当前页交给 FastDrop</button>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
