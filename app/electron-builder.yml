# electron-builder 配置。
#
# 关键点是 extraResources：Rust 引擎是独立子进程，不在 node_modules 里，
# 打进 asar 里也 spawn 不了（asar 需要解包路径）。必须作为普通文件落到
# resources/，engine.ts 的 enginePath() 就是按 process.resourcesPath 找的。
# 漏配这一项，打包后的应用启动正常、一点下载才报「Rust 引擎未找到」。

appId: com.fastdrop.app
productName: FastDrop
executableName: fastdrop

directories:
  # 产物落到 release/（已在 .gitignore）
  output: release
  buildResources: build

# 复用 node_modules 里随 electron 依赖装好的发行版，构建时不再联网取
# electron release（缓存更稳，也不需要配置下载代理）。
electronDist: node_modules/electron/dist

files:
  # 只打打包产物本身，不要连 src/、测试、探针一起塞进安装包。
  #
  # 注意这里**故意没有** node_modules。electron-vite 已经把 vue、antd-vue、
  # dayjs、icons 全量打进 out/renderer/assets/（渲染产物是单文件 bundle，
  # 里面没有任何外部 import；out/main 和 out/preload 也只 require electron
  # 和 node: 内置模块）。运行时完全不解析 node_modules，把它一起打包纯粹是
  # 白白多出 66 MB 的 ant-design-vue 全量 locale + TS 声明。
  # 之前那行 `- node_modules/**/*` 让 asar 从 27 MB 膨胀到 93 MB。
  - out/**/*
  - package.json

extraResources:
  - from: ../engine-rs/target/release/fastdrop-engine.exe
    to: fastdrop-engine.exe
    filter:
      - "**/*"

win:
  # 不带图标资源，用 Electron 默认图标；后面补 build/icon.ico 会自动被识别
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
